<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>团团小屋原型</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=ZCOOL+KuaiLe&display=swap">
<style>
/* 版式：左边一台可以真的点的手机（孩子看到的），右边一栏「幕后」（家长关心的：这题怎么标价、记了什么、照顾要花多少） */
:root{
  --bg:#f8f7f2;--paper:#fdfcf8;--ink:#20231f;--muted:#6b7069;--line:#deddd4;--green:#285d3b;--amber:#b85f0e;--code:#f1f0e8;
  --serif:'Noto Serif SC','Songti SC',serif;--sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --kid:'ZCOOL KuaiLe','Noto Sans SC','PingFang SC',sans-serif;--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --k-bg:#e9f6ec;--k-card:#ffffff;--k-ink:#1d3327;--k-dim:#5f7a69;--k-leaf:#2f8f5b;--k-leaf-d:#206a42;--k-coin:#f08a1c;
  --k-sun:#ffd766;--k-belly:#fff3c9;--k-sky:#3b8fd6;--k-berry:#e0527a;--k-line:#cfe6d5;--k-wall:#fff7e0;--k-ok:#dff3e5;--k-bad:#fde4ea;--k-miss:#fff1dc;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141915;--paper:#1b221c;--ink:#e6e9e1;--muted:#9aa197;--line:#2f3830;--green:#8fc79f;--amber:#f0a04b;--code:#222a23;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141915;--paper:#1b221c;--ink:#e6e9e1;--muted:#9aa197;--line:#2f3830;--green:#8fc79f;--amber:#f0a04b;--code:#222a23;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 14px/1.7 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--k-sky);outline-offset:2px}
.page{max-width:1060px;margin:0 auto;padding-inline:16px;padding-block:28px 60px;display:grid;grid-template-columns:390px minmax(0,1fr);gap:28px;align-items:start}
.intro{grid-column:1/-1}
.intro h1{font:700 26px/1.3 var(--serif);margin:0;letter-spacing:.03em}
.intro p{margin:6px 0 0;color:var(--muted);max-width:46em}

/* 手机 */
.phone{border:8px solid var(--k-ink);border-radius:34px;background:var(--k-bg);color:var(--k-ink);overflow:hidden;font:500 14px/1.5 var(--sans);display:flex;flex-direction:column;height:min(780px,calc(100vh - 24px));min-height:560px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.k-top{display:flex;align-items:center;gap:6px;padding:14px 16px 8px;min-height:54px}
.k-top h2{font:400 19px var(--kid);margin:0 auto 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{font-size:22px;line-height:1;padding:2px 6px 4px 0}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--k-card);border-radius:999px;padding:3px 10px 3px 6px;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.ico{width:15px;height:15px;display:inline-block;flex:none}
.ico.coin{border-radius:50%;background:var(--k-coin);box-shadow:inset 0 0 0 2.5px #ffffff73}
.ico.star{background:var(--k-sky);clip-path:polygon(50% 0,62% 35%,98% 35%,69% 57%,80% 92%,50% 71%,20% 92%,31% 57%,2% 35%,38% 35%)}
.k-body{padding:4px 16px 16px;display:grid;gap:11px;align-content:start;flex:1;overflow-y:auto;position:relative}
.k-card{background:var(--k-card);border-radius:16px;padding:11px 13px}
.k-btn{display:block;width:100%;text-align:center;background:var(--k-leaf);color:#fff;border-radius:16px;padding:11px;font:400 18px var(--kid);box-shadow:0 4px 0 var(--k-leaf-d)}
.k-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--k-leaf-d)}
.k-btn:disabled{opacity:.45;box-shadow:none}
.k-btn small{display:block;font:500 12px var(--sans);opacity:.92}
.k-btn.ghost{background:var(--k-card);color:var(--k-ink);box-shadow:0 3px 0 var(--k-line);font-size:15px;padding:8px}
.dim{color:var(--k-dim);font-size:12.5px;margin:0}
.room{background:linear-gradient(var(--k-wall) 0 70%,#d9c08f 70% 100%);border-radius:18px;position:relative;padding:8px 10px 2px;text-align:center;overflow:hidden;cursor:pointer}
.room svg,.room img{width:150px;height:150px;object-fit:contain;display:block;margin:0 auto}
.curtain::before,.curtain::after{content:"";position:absolute;top:0;width:34px;height:74px;background:var(--k-berry);opacity:.85}
.curtain::before{left:0;border-radius:0 0 28px 0}.curtain::after{right:0;border-radius:0 0 0 28px}
.mood-tag{position:absolute;left:10px;bottom:8px;font-size:11.5px;background:var(--k-card);border-radius:999px;padding:1px 8px}
.bubble{background:var(--k-card);border-radius:14px;padding:8px 12px;font-size:13.5px;position:relative;min-height:38px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:var(--k-card);transform:translateX(-50%) rotate(45deg)}
.bubble.plain::after{display:none}
.bubble.warn{background:var(--k-bad)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 9px;align-items:center;font-size:13px}
.bar{height:9px;border-radius:9px;background:var(--k-line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--k-leaf);transition:width .4s}
.bar.b i{background:var(--k-berry)}.bar.s i{background:var(--k-sky)}.bar.c i{background:#69b7d8}
.bar.low i{background:var(--k-coin)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.acts button{background:var(--k-card);border-radius:14px;padding:8px 2px;text-align:center;font:400 15px var(--kid);box-shadow:0 3px 0 var(--k-line)}
.acts small{display:block;font:500 11px var(--sans);color:var(--k-dim)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--k-card);border-top:1px solid var(--k-line)}
.nav button{padding:10px 0 12px;font:400 15px var(--kid);color:var(--k-dim)}
.nav button.on{color:var(--k-leaf);box-shadow:inset 0 3px 0 var(--k-leaf)}
.quest{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;width:100%;text-align:left;box-shadow:0 3px 0 var(--k-line)}
.quest b{font:400 17px var(--kid)}
.quest .pill{background:var(--k-bg)}
.quest.done{opacity:.6;box-shadow:none}
.quest.lock{opacity:.6;border:1.5px dashed var(--k-dim);background:transparent;box-shadow:none}
.tag{font:700 11px var(--sans);border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:2px}
.tag.hot{color:#fff;background:var(--k-berry)}.tag.old{color:var(--k-ink);background:var(--k-sun)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;font-size:12px;text-align:center}
.steps span{border-radius:9px;padding:4px 2px;background:var(--k-line);color:var(--k-dim)}
.steps .done{background:var(--k-leaf);color:#fff}.steps .now{background:var(--k-sun);color:var(--k-ink);font-weight:700}
.q{font-size:16px;line-height:2.15}
.q.big{font:700 26px/1.6 var(--sans);text-align:center;letter-spacing:.04em}
.seg{border:2px dashed var(--k-line);border-radius:10px;padding:1px 3px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg.on{border:2px solid var(--k-berry);background:#fff5f8}
.seg.key{border:2px solid var(--k-leaf);background:var(--k-ok)}
.seg.miss{border:2px dashed var(--k-coin);background:var(--k-miss)}
.seg.noise{border:2px solid #b9bfb2;background:#f1f1ec;text-decoration:line-through;text-decoration-color:#9aa197}
.seg.fixed{cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--k-dim)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:3px}
.tok{display:inline-block;min-width:34px;padding:2px 6px;border-radius:10px}
button.tok{background:var(--k-bg);box-shadow:0 3px 0 var(--k-line);margin:0 2px}
.opts{display:grid;gap:8px}
.opts button{border:2px solid var(--k-line);border-radius:12px;padding:8px 12px;font:700 15px var(--sans);background:var(--k-card);text-align:left}
.expr{font:700 18px/1.8 var(--sans);text-align:center}
.ans{font-size:15.5px;line-height:2.2}
.box{min-width:56px;min-height:34px;text-align:center;border:2px solid var(--k-leaf);border-radius:11px;background:var(--k-card);font:700 20px/30px var(--sans);padding:0 10px;display:inline-block;vertical-align:middle}
.uslot{display:inline-block;min-width:44px;min-height:30px;border:2px dashed var(--k-coin);border-radius:9px;vertical-align:middle}
.uchip{display:inline-block;border:2px solid var(--k-leaf);background:var(--k-ok);border-radius:9px;padding:0 9px;font-weight:700;vertical-align:middle}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.pad button{background:var(--k-card);border-radius:11px;padding:8px 0;font:700 18px var(--sans);box-shadow:0 3px 0 var(--k-line)}
.pad button.u{font:700 15px var(--sans);background:#fff8e6;box-shadow:0 3px 0 #f1dfb4}
.pad button.go{background:var(--k-leaf);color:#fff;box-shadow:0 3px 0 var(--k-leaf-d);font:400 17px var(--kid)}
.line{font:700 19px/2 var(--sans)}
.clock{display:block;margin:0 auto;width:210px;height:210px}
.clock .face{fill:var(--k-card);stroke:var(--k-ink);stroke-width:3}
.clock text{font:700 13px var(--sans);fill:var(--k-ink);text-anchor:middle;dominant-baseline:central}
.clock .dot{fill:var(--k-line);cursor:pointer}.clock .dot.on{fill:var(--k-berry)}
.clock .hh{stroke:var(--k-berry);stroke-width:6;stroke-linecap:round}.clock .mh{stroke:var(--k-ink);stroke-width:3.5;stroke-linecap:round}
.cover{position:absolute;inset:0;background:var(--k-bg);display:grid;place-content:center;gap:10px;text-align:center;z-index:3;padding:20px}
.cover svg,.cover img{width:120px;height:120px;margin:0 auto;object-fit:contain}
.fb{border-radius:16px;padding:12px 14px;background:var(--k-ok);position:relative}
.fb.zero{background:var(--k-bad)}
.fb b.c{font:400 26px var(--kid);color:var(--k-coin);display:flex;align-items:center;gap:6px}
.fb .ico{width:20px;height:20px}
.rows{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-variant-numeric:tabular-nums}
.rows b{text-align:right}
.sum{font:400 36px/1.2 var(--kid);color:var(--k-coin);display:flex;align-items:center;gap:8px;justify-content:center}
.sum .ico{width:26px;height:26px}
/* 答题时的宠物头像和技能环 */
.buddy{display:flex;align-items:center;gap:6px;background:var(--k-card);border-radius:999px;padding:2px 10px 2px 2px}
.ava{width:36px;height:36px;border-radius:50%;background:var(--k-wall);overflow:hidden;display:grid;place-items:center}
.ava svg,.ava img{width:40px;height:40px;object-fit:contain}
.ring{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--k-sky) calc(var(--p)*1%),var(--k-line) 0)}
.ring b{width:20px;height:20px;border-radius:50%;background:var(--k-card);display:grid;place-items:center;font-size:10.5px}
.buddy small{font-size:11px;line-height:1.2;color:var(--k-dim)}
.buddy small b{display:block;color:var(--k-ink);font-size:12px}
.cere{position:absolute;inset:0;z-index:4;display:grid;place-content:center;text-align:center;pointer-events:none;background:#e9f6ecee;animation:cere 2.2s ease forwards}
.cere .ava{width:96px;height:96px;margin:0 auto;box-shadow:0 0 0 6px var(--k-sun),0 0 30px 10px #ffd76699}
.cere .ava svg,.cere .ava img{width:104px;height:104px}
.cere b{font:400 24px var(--kid);margin-top:12px;display:block}
.cere .stars{position:relative;height:0}
.cere .stars i{position:absolute;left:50%;top:-60px;width:16px;height:16px;background:var(--k-sun);clip-path:polygon(50% 0,62% 35%,98% 35%,69% 57%,80% 92%,50% 71%,20% 92%,31% 57%,2% 35%,38% 35%);animation:burst 1s ease-out forwards}
@keyframes cere{0%{opacity:0}10%,75%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes burst{from{transform:translate(-50%,0) scale(.3)}to{transform:translate(calc(-50% + var(--x)),var(--y)) scale(1)}}
.fly{position:absolute;right:16px;top:6px;font:400 20px var(--kid);color:var(--k-coin);animation:fly 1.2s ease forwards}
@keyframes fly{from{transform:translateY(0);opacity:1}to{transform:translateY(-36px);opacity:0}}
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.skill{background:var(--k-card);border-radius:14px;padding:9px 4px;text-align:center;box-shadow:0 3px 0 var(--k-line)}
.skill b{display:block;font:400 16px var(--kid)}
.skill small{display:block;color:var(--k-dim);font-size:11.5px}
.skill.sel{box-shadow:0 0 0 2.5px var(--k-leaf)}
.dots{display:flex;gap:3px;justify-content:center;margin-top:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--k-line)}.dots i.f{background:var(--k-sky)}
.shop{display:grid;grid-template-columns:1fr auto;gap:9px 8px;align-items:center}
.shop small{display:block;color:var(--k-dim);font-size:12px;font-weight:400}
.shop h3{grid-column:1/-1;margin:0;font:400 15px var(--kid);color:var(--k-dim)}
.buy{background:var(--k-bg);border-radius:999px;padding:4px 12px 4px 7px;font-weight:700;display:inline-flex;gap:5px;align-items:center;box-shadow:0 2px 0 var(--k-line)}
.wish{background:var(--k-sun);border-radius:16px;padding:11px 13px}
.stamps{display:flex;gap:6px;margin-top:6px}
.stamps i{width:22px;height:22px;border-radius:50%;border:2px dashed var(--k-ink);opacity:.45}
.stamps i.f{border-style:solid;background:var(--k-leaf);border-color:var(--k-leaf);opacity:1}
.pb{fill:#f4b860}.pbel{fill:var(--k-belly)}.pd{fill:#d9893a}.pk{fill:#c79a5e}.pl{fill:var(--k-leaf)}.pe{fill:var(--k-ink)}.pc{fill:var(--k-berry);opacity:.45}.pf{fill:var(--k-berry)}.pw{fill:#fff}.ps{fill:var(--k-sky)}.pt{fill:#ffc531;stroke:var(--k-ink);stroke-width:1}.pz{fill:none;stroke:var(--k-ink);stroke-width:2;stroke-linecap:round}
/* 宠物动作 */
.breathe{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes breathe{50%{transform:scale(1.03,.97)}}
.a-hop{animation:hop .5s ease 2}.a-spin{animation:spin .9s ease}.a-look{animation:look 1.2s ease}.a-squish{animation:squish 1.4s ease}
.a-stretch{animation:stretch 1.2s ease}.a-think{animation:think 1.6s ease}.a-giggle{animation:giggle .5s linear 2}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}}
@keyframes spin{0%{transform:rotate(0)}30%{transform:rotate(-12deg)}70%{transform:rotate(12deg)}100%{transform:rotate(0)}}
@keyframes look{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes squish{0%,100%{transform:scale(1)}40%{transform:scale(1.1,.86)}}
@keyframes stretch{0%,100%{transform:scale(1)}40%{transform:scale(.92,1.12)}}
@keyframes think{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(8deg)}}
@keyframes giggle{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.breathe,[class*="a-"],.cere,.cere .stars i,.fly{animation:none!important}.cere{display:none}.bar i{transition:none}}

/* 幕后 */
.side{display:grid;gap:14px;min-width:0}
.panel{border:1px solid var(--line);border-radius:11px;background:var(--paper);padding:14px 16px;min-width:0}
.panel h3{font:700 15px var(--serif);color:var(--green);margin:0 0 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:13.5px}
.kv dt{color:var(--muted);white-space:nowrap}.kv dd{margin:0;min-width:0}
.calc{font:600 15px var(--serif);color:var(--amber);margin:0}
pre{margin:0;overflow-x:auto;background:var(--code);border-radius:8px;padding:10px 12px;font:12px/1.6 var(--mono);color:var(--ink);max-height:230px}
.ctl{display:flex;flex-wrap:wrap;gap:7px}
.ctl button,.ctl label{border:1px solid var(--line);border-radius:7px;padding:3px 10px;background:var(--bg);font-size:13px;cursor:pointer}
.ctl button.on{border-color:var(--green);color:var(--green);font-weight:700}
.ctl input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.muted{color:var(--muted);font-size:13px;margin:6px 0 0}
@media(max-width:860px){.page{grid-template-columns:1fr}.phone{position:static;max-width:420px;width:100%;margin:0 auto;height:740px}}
@media(max-width:440px){.phone{border-width:0;border-radius:18px}}
</style>

<div class="page">
  <p style="grid-column:1/-1;border:1px solid #d9a441;border-radius:8px;padding:8px 12px;font-size:13px">这是早期的可点原型（数据不保存），正式实现见 kid/。</p>
  <div class="intro">
    <h1>团团小屋 · 可点的原型 v0.2</h1>
    <p>左边是孩子看到的，可以做题、赚金币、照顾宠物、学本领；在小屋里什么都不点，宠物过一会儿会自己说话。右边是幕后：每道题怎么标价、答完记下了什么、照顾一天要花多少。演示版一天 12 题，题目取自 W39 的真实错题类型，刷新即重来。小狗形象是占位，可以在右下角换成你生成的图。</p>
  </div>
  <div class="phone" id="app" aria-live="polite"></div>
  <div class="side" id="side"></div>
</div>

<script>
(() => {
const BASE = { oral: 1, first: 2, clock: 4, steps: 6, word: 12 }
const FNAME = { oral: '口算闪答', first: '先算哪一步', clock: '拨钟面', steps: '递等式分步', word: '应用题三步' }
const MIN = { oral: 2, first: 3, clock: 5, steps: 6, word: 8 }           // 最短思考秒数（演示版调短了）
const DIFF = { 同构: 1, 略变: 1.3, 综合: 1.6 }
const SRC = { 本周重点: 1.5, 往周未过关: 1.2, 下周预习: 1, 已掌握保温: 0.8 }
const SKILLS = [
  { k: '审题', n: '灵鼻子', s: '审题', d: '你圈对关键词时，它会凑过去嗅一嗅，跟着指出来。' },
  { k: '概念不清', n: '排排队', s: '运算顺序', d: '团团会把先算的部分举起来。' },
  { k: '计算失误', n: '稳稳爪', s: '计算', d: '算完先估一估位数。' },
  { k: '格式规范', n: '收尾巴', s: '答句单位', d: '答句写完整，单位不落下。' },
  { k: '漏题', n: '巡逻', s: '检查', d: '交卷前绕着作业走一圈。一整天没有急着答错的题，得 1 点。' },
  { k: '策略缺失', n: '探路', s: '找规律', d: '画图、列表、找规律。' },
]
const COST = [3, 6, 10]
// 应用题：题干每一段都能圈。k=关键词，n=用不上的噪音，其余是普通信息（圈了不算错）
const GROUPS = [
  { id: 'g1', name: '口算热身', sub: '加减法和乘法口算', src: '已掌握保温', kp: 'EX.02 口算', items: [
    { id: 'W40-t01-004', f: 'oral', lv: '同构', err: '计算失误', text: '35 × 6', a: 210, traps: { 190: '计算失误' }, hint: '30×6=180，5×6=30，合起来。', explain: '180+30=210。' },
    { id: 'W40-t01-011', f: 'oral', lv: '同构', err: '计算失误', text: '200 − 55', a: 145, traps: {}, hint: '200−50=150，再减 5。', explain: '150−5=145。' },
    { id: 'W40-t02-007', f: 'oral', lv: '同构', err: '计算失误', text: '3 × 120', a: 360, traps: { 460: '计算失误' }, hint: '3×12=36，末尾添一个 0。', explain: '3×12=36，添 0 得 360。' },

// ---------- 做题 ----------
function startQ(it, g) {
  clearTimeout(timer)
  Q = { it, g, step: 0, sel: new Set(), input: '', unit: null, zone: null, wrongs: S.wr[it.id] || 0, msg: '', flash: false, fin: null, cover: false, t0: Date.now(), order: it.choices ? it.choices.map((_, i) => i) : null, kw: null, kwMsg: '', mood: '' }
  if (S.slow > 0) { Q.cover = true; timer = setTimeout(() => { if (Q && Q.it === it && view === 'q') { S.slow--; Q.cover = false; Q.t0 = Date.now(); render() } }, 3000) }
  view = 'q'
}
function wrong(given, err, step, note) {
  const it = Q.it, ms = Date.now() - Q.t0, fast = ms < MIN[it.f] * 1000 && step !== '忘写单位'
  Q.wrongs++; S.wr[it.id] = Q.wrongs; S.combo = 0; Q.flash = fast; Q.mood = 'think'
  if (fast) { S.flash++; S.slow = 3 }
  S.log.push({ item: it.id, try: Q.wrongs, correct: false, given, trap_error_type: err, step_failed: step, ms, coins: 0 })
  if (Q.wrongs >= 3) return finish()
  Q.msg = (fast ? '太快啦，还没看清题。接下来几题我们慢慢来。<br>' : '') + (note || (Q.wrongs === 1 ? '提示：' + (it.lines?.[Q.step]?.hint || it.hint) : '讲解：' + it.explain + ' 再试一次。'))
  if (Q.order) Q.order.sort(() => Math.random() - .5)
  Q.t0 = Date.now()
}
function finish() {
  const { it, g } = Q, w = Q.wrongs, q = w === 0 ? 1 : w === 1 ? (it.f === 'first' ? .3 : .5) : w === 2 ? .3 : 0
  const raw = BASE[it.f] * DIFF[it.lv] * SRC[g.src] * q, core = q ? Math.max(1, Math.round(raw)) : 0
  const pb = !q ? 0 : it.f === 'steps' ? 2 : it.f === 'word' ? Q.kw : 0
  let c = core + pb, bonus = false, point = ''
  if (w === 0) { S.combo++; S.best = Math.max(S.best, S.combo); if (S.combo % 5 === 0) { c += 5; bonus = true } }
  if (w === 0 && it.lv !== '同构') { if (++S.prog[it.err] >= 5) { S.prog[it.err] = 0; S.pts[it.err]++; point = SKILLS.find(s => s.k === it.err).n } }
  const growB = good() ? Math.round(c * .2) : 0
  S.coins += c; S.grow += c + growB; S.today += c; S.done[it.id] = { c, w, ok: q > 0 }
  if (allDone() && !S.flash && !S.patrol) { S.pts.漏题++; S.patrol = true }

const zoneName = z => z % 2 ? `${(z - 1) / 2 || 12} 和 ${(z + 1) / 2} 中间` : `指着 ${z / 2 || 12}`

    const need = [['state_hungry', S.full], ['state_bored', S.mood], ['state_dirty', S.clean]].filter(([, v]) => v < 40)

}
const add = (k, v) => { S[k] = Math.min(100, S[k] + v) }
const A = {
  go(v) { clearTimeout(timer); if (v === 'home' && view !== 'home') chat(); if (v === 'shop') say = ''; view = v },
  group(id) { const g = GROUPS.find(x => x.id === id), it = g.items.find(x => !S.done[x.id]); if (it) startQ(it, g) },
  key(k) { if (Q.cover || Q.fin) return; Q.input = k === '⌫' ? Q.input.slice(0, -1) : (Q.input + k).slice(0, 5) },
  seg(i) { i = +i; Q.sel.has(i) ? Q.sel.delete(i) : Q.sel.add(i) },
  circled() { const it = Q.it, keys = it.segs.map((s, i) => s.k ? i : -1).filter(i => i >= 0)

  kwok() { Q.step = 2; Q.t0 = Date.now() },
  choice(i) { const ch = Q.it.choices[+i]; if (ch.ok) { Q.step = 3; Q.msg = ''; Q.t0 = Date.now() } else wrong(ch.t, Q.it.err, '选算式') },
  unit(u) { if (!Q || Q.fin) return; Q.unit = u || null },
  zone(z) { Q.zone = +z },
  tok(i) { const it = Q.it; +i === it.a ? finish() : wrong('先算 ' + it.toks[+i], it.err, '先算哪一步') },

  next() { const it = Q.g.items.find(x => !S.done[x.id]); if (it) return startQ(it, Q.g)
    if (allDone()) { chat('after_practice'); view = 'result' } else view = 'quests' },
  care(kind) {

    else { add('clean', x.clean); say = '泡泡澡好舒服，香香的！'; act = 'spin' } },
  pat() { if (S.pats >= 3) { say = '今天已经摸了好多次啦，陪我玩玩具吧！'; act = 'giggle'; return } S.pats++; add('mood', 3); say = '嘿嘿，舒服。心情 ＋3。'; act = 'squish' },
  tapPet() { const now = Date.now(); taps = [...taps.filter(t => now - t < 3000), now]; const l = pick(LINES[taps.length >= 5 ? 'tap_too_much' : 'tap']); say = fill(l.t); act = l.act },
  sel(k) { sel = k },
  learn() { const lv = S.skill[sel]; if (lv < 3 && S.pts[sel] >= COST[lv]) { S.pts[sel] -= COST[lv]; S.skill[sel]++; say = `我学会「${SKILLS.find(s => s.k === sel).n}」第 ${lv + 1} 级啦！`; act = 'spin'; view = 'home' } },
  buy(k) { const x = GOODS.find(g => g.k === k); if (S.coins < x.p) { say = `还差 ${x.p - S.coins} 金币，做任务就能赚到。`; return }

    say = x.kind === 'keep' ? `买到「${x.n}」了，回小屋看看。` : `「${x.n}」放进背包了，回小屋就能用。` },
  stage(i) { S.stage = +i },
  ulv(v) { unitLv = +v },
  gift() { S.coins += 300 },
  fast() { S.slow = 3 },
  chat() { chat(); view = 'home' },
  nextday() { clearTimeout(timer); for (const k in DECAY) S[k] = Math.max(20, S[k] - DECAY[k])
    Object.assign(S, { done: {}, wr: {}, today: 0, combo: 0, flash: 0, slow: 0, pats: 0, spent: 0, circled: 0, kwPerfect: 0, forgotUnit: 0, patrol: false, day: S.day % 5 + 1 })
    Q = null; view = 'home'; chat() },
  reset() { clearTimeout(timer); S = fresh(); view = 'home'; Q = null; say = '你来啦！今天有「第几次」的题，我们一起找关键词吧。'; act = 'hop' },
}
const act_ = e => { const t = e.target.closest('[data-a]'); if (!t || t.disabled) return

if (typeof document.addEventListener === 'function') {

    files.forEach((f, i) => { const r = new FileReader(); r.onload = () => { IMG[i] = r.result; render() }; r.readAsDataURL(f) }) })
